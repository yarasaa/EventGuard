name: publish-nuget-preview
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful build-and-reliability run ID for the current main commit
        required: true
        type: string
      version:
        description: Exact preview version from Directory.Build.props
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: nuget-preview-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'yarasaa/EventGuard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$CI_RUN_ID" in ''|*[!0-9]*) echo 'CI run ID must be numeric.' >&2; exit 1;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          python3 eng/verify-release.py check-run --run "$RUNNER_TEMP/ci-run.json" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: Download the packages tested by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.sha }}
          path: .artifacts/release
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify package identity, contents and hashes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python3 eng/verify-release.py check-artifacts --packages .artifacts/release
          --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - run: python3 eng/bootstrap_dotnet.py
      - name: Obtain a short-lived NuGet credential
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: yarasa
      - name: Publish verified preview packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          for package in .artifacts/release/*.nupkg; do
            bash eng/dotnet.sh nuget push "$package" --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --skip-duplicate
          done
