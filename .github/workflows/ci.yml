name: build-and-reliability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,TESTPROXY://:19094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092,TESTPROXY://127.0.0.1:29092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,TESTPROXY:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports:
          - 19092:19092
          - 19094:19094
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"
          --health-interval 5s --health-timeout 10s --health-retries 40
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:97b448857967be55e005424a660056fe6d51814435804dc07e8f79f028bab5fb
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "EventGuard-Local-Only!2026"
          MSSQL_MEMORY_LIMIT_MB: "2048"
        ports:
          - 51433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'EventGuard-Local-Only!2026' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s --health-timeout 5s --health-retries 40
      rabbitmq:
        image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
        env:
          RABBITMQ_DEFAULT_USER: eventguard
          RABBITMQ_DEFAULT_PASS: eventguard-local-only
          RABBITMQ_DEFAULT_VHOST: eventguard_test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: eventguard
          POSTGRES_PASSWORD: eventguard-local-only
          POSTGRES_DB: eventguard_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U eventguard -d eventguard_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 eng/check-repository.py
      - run: python3 eng/bootstrap_dotnet.py
      - run: bash eng/verify.sh
      - run: bash eng/dotnet.sh run --project samples/EventGuard.Sample -c Release --no-build
      - run: bash eng/dotnet.sh run --project samples/EventGuard.RabbitMq.Sample -c Release --no-build
      - run: bash eng/dotnet.sh run --project samples/EventGuard.SqlServer.Sample -c Release --no-build
      - run: bash eng/dotnet.sh run --project samples/EventGuard.Kafka.Sample -c Release --no-build
      - run: bash eng/dotnet.sh run --project samples/EventGuard.Dashboard.Sample -c Release --no-build
      - run: python3 eng/verify-onboarding.py --output .artifacts/ci-onboarding
      - run: bash pilots/CatalogPilot/pilot.sh build
      - run: bash pilots/CatalogPilot/pilot.sh verify --framework both
